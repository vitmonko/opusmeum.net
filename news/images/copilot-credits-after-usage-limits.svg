<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#f3f4f6"/>
  <!-- filled usage bar -->
  <rect x="70" y="270" width="420" height="90" rx="45" fill="#fff" stroke="#000" stroke-width="12"/>
  <rect x="86" y="286" width="388" height="58" rx="29" fill="#000"/>
  <!-- limit line -->
  <path d="M530 160 V470" stroke="#000" stroke-width="14" stroke-linecap="round"/>
  <!-- split lanes -->
  <path d="M570 315 C660 315 660 190 750 190 H850" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
  <path d="M570 315 C660 315 660 440 750 440 H850" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 26"/>
  <circle cx="570" cy="315" r="16" fill="#000"/>
  <!-- plain lane end -->
  <circle cx="910" cy="190" r="48" fill="#fff" stroke="#000" stroke-width="12"/>
  <!-- coin stack -->
  <g stroke="#f3f4f6" stroke-width="8">
    <rect x="850" y="450" width="130" height="44" rx="22" fill="#000"/>
    <rect x="850" y="410" width="130" height="44" rx="22" fill="#000"/>
    <rect x="850" y="370" width="130" height="44" rx="22" fill="#000"/>
  </g>
  <!-- dial -->
  <g transform="translate(1075 330)">
    <path d="M-80 0 A80 80 0 0 1 80 0" fill="none" stroke="#dfe2e6" stroke-width="30"/>
    <path d="M-80 0 A80 80 0 0 1 80 0" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <path d="M0 0 L48 -54" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    <circle r="18" fill="#000"/>
  </g>
</svg>
