    <rect x="352" y="440" width="80" height="12" rx="6"/><rect x="352" y="468" width="52" height="12" rx="6"/>
    <rect x="768" y="140" width="80" height="12" rx="6"/><rect x="768" y="168" width="52" height="12" rx="6"/>
