<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#000"/>
  <!-- data outside the boundary -->
  <g fill="#3a3d42">
    <rect x="80" y="90" width="110" height="140" rx="14"/>
    <rect x="80" y="400" width="110" height="140" rx="14"/>
    <rect x="1010" y="90" width="110" height="140" rx="14"/>
    <rect x="1010" y="400" width="110" height="140" rx="14"/>
  </g>
  <g fill="#000">
    <rect x="102" y="120" width="66" height="10" rx="5"/><rect x="102" y="142" width="44" height="10" rx="5"/>
    <rect x="102" y="430" width="66" height="10" rx="5"/><rect x="102" y="452" width="44" height="10" rx="5"/>
    <rect x="1032" y="120" width="66" height="10" rx="5"/><rect x="1032" y="142" width="44" height="10" rx="5"/>
    <rect x="1032" y="430" width="66" height="10" rx="5"/><rect x="1032" y="452" width="44" height="10" rx="5"/>
  </g>
  <!-- blocked flows -->
  <g stroke="#6b7078" stroke-width="8" stroke-linecap="round" fill="none" stroke-dasharray="2 20">
    <path d="M200 160 L300 200 M200 470 L300 430 M1000 160 L900 200 M1000 470 L900 430"/>
  </g>
  <!-- control layers -->
  <g fill="none" stroke-width="14">
    <rect x="310" y="70" width="580" height="490" rx="120" stroke="#ffffff" stroke-opacity=".28"/>
    <rect x="380" y="130" width="440" height="370" rx="92" stroke="#ffffff" stroke-opacity=".55"/>
    <rect x="450" y="190" width="300" height="250" rx="64" stroke="#ffffff"/>
  </g>
  <!-- agents inside -->
  <g fill="#fff">
    <circle cx="540" cy="315" r="30"/>
    <circle cx="660" cy="315" r="30"/>
    <circle cx="600" cy="255" r="22"/>
    <circle cx="600" cy="375" r="22"/>
  </g>
</svg>
