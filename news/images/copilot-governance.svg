<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <clipPath id="lens"><circle cx="760" cy="300" r="160"/></clipPath>
    <g id="row">
      <rect x="0" y="0" width="96" height="120" rx="12"/>
      <rect x="128" y="0" width="96" height="120" rx="12"/>
      <rect x="256" y="0" width="96" height="120" rx="12"/>
      <rect x="384" y="0" width="96" height="120" rx="12"/>
      <rect x="512" y="0" width="96" height="120" rx="12"/>
      <rect x="640" y="0" width="96" height="120" rx="12"/>
      <rect x="768" y="0" width="96" height="120" rx="12"/>
      <rect x="896" y="0" width="96" height="120" rx="12"/>
    </g>
    <g id="grid"><use href="#row"/><use href="#row" y="152"/><use href="#row" y="304"/><use href="#row" y="456"/></g>
  </defs>
  <rect width="1200" height="630" fill="#f3f4f6"/>
  <g transform="translate(104 -6)" fill="#dfe2e6"><use href="#grid"/></g>
  <g transform="translate(104 -6)" fill="#b9bec5">
    <rect x="128" y="152" width="96" height="120" rx="12"/>
    <rect x="256" y="456" width="96" height="120" rx="12"/>
  </g>
  <!-- the lens reveals which documents are shared with everyone -->
  <g clip-path="url(#lens)">
    <rect width="1200" height="630" fill="#fff"/>
    <g transform="translate(104 -6)" fill="#e9ebee"><use href="#grid"/></g>
    <g transform="translate(104 -6)" fill="#000">
      <rect x="640" y="152" width="96" height="120" rx="12"/>
      <rect x="512" y="304" width="96" height="120" rx="12"/>
    </g>
  </g>
  <circle cx="760" cy="300" r="160" fill="none" stroke="#000" stroke-width="20"/>
  <path d="M877 417 L985 525" stroke="#000" stroke-width="44" stroke-linecap="round"/>
</svg>
